name: iOS Fix Provisioning (Associated Domains)

# Manual: enable ASSOCIATED_DOMAINS on the App ID and recreate Conora App Store profile.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fix-profile:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          if [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "Missing APP_STORE_CONNECT_API_KEY_BASE64"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          echo "APP_STORE_CONNECT_API_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Enable Associated Domains and recreate profile
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          OUT_DIR: ${{ runner.temp }}/ios-profile
        run: node scripts/ios-enable-associated-domains.mjs

      - name: Upload regenerated profile
        uses: actions/upload-artifact@v4
        with:
          name: conora-app-store-provision
          path: |
            ${{ runner.temp }}/ios-profile/Conora_App_Store.mobileprovision
            ${{ runner.temp }}/ios-profile/profile.b64
          retention-days: 1
